<body><a class="skip" href="#main">跳到主要内容</a><header><div class="head"><div class="head-row"><div><p class="eyebrow">MAKAPLANET · AIDSO FAST_WEB · 部分采集 · 审计视图</p><h1>玛卡星球引用源仪表盘</h1><p>核心结论、内容新旧、来源结构与逐题回答引用明细。</p></div><span class="status" role="status" aria-live="polite" data-status>读取中</span></div><div class="meta"><span>快照 <b data-snapshot>--</b></span><span>计划槽位 <b data-planned>--</b></span><span>有效回答 <b data-valid>--</b></span><span>数据哈希 <b class="hash" data-hash>--</b></span></div></div></header><main id="main"><div class="callout" role="status"><b>抖音账号与发布时间：部分结果</b><span>已处理 1005 / 2339 个作品；成功 967，字段不完整 6，失败 32，待采集 1334。覆盖率分母包含全部目标作品；账号排名与时间分布为阶段性结果。</span></div><div class="callout" data-callout><b>数据边界</b><span>正在读取冻结数据。</span></div><div class="tabs" role="tablist" aria-label="问题组"><button role="tab" id="group-tab-total" aria-controls="group-panel" aria-selected="true" tabindex="0" data-group="total">总览</button><button role="tab" id="group-tab-A" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="A">A 组</button><button role="tab" id="group-tab-B" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="B">B 组</button><button role="tab" id="group-tab-C" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="C">C 组</button><button role="tab" id="group-tab-D" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="D">D 组</button><button role="tab" id="group-tab-E" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="E">E 组</button><button role="tab" id="group-tab-F" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="F">F 组</button><button role="tab" id="group-tab-G" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="G">G 组</button><button role="tab" id="group-tab-H" aria-controls="group-panel" aria-selected="false" tabindex="-1" data-group="H">H 组</button></div><div id="group-panel" role="tabpanel" aria-labelledby="group-tab-total" tabindex="0" data-view></div></main><script>
    const VIEW="citation";
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const pct=value=>value==null?'数据不足':Number(value).toFixed(2).replace(/\.00$/,'')+'%';
    const num=value=>Number(value||0).toLocaleString('zh-CN');
    const metric=(slice,id)=>slice.metrics?.[id]||{};
    const safeUrl=value=>{try{const url=new URL(String(value));return ['http:','https:'].includes(url.protocol)?url.href:'#'}catch{return '#'}};
    const card=(label,value,note,status='READY')=>'<div class="kpi" data-status="'+esc(status)+'"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong><span>'+esc(note)+'</span></div>';
    const bars=(rows,labelKey='name',valueKey='share')=>rows.length?rows.map(row=>'<div class="bar"><span>'+esc(row[labelKey])+'</span><div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(100,Number(row[valueKey]||0)))+'%"></div></div><b>'+pct(row[valueKey])+'</b></div>').join(''):'<div class="empty">暂无可比较数据</div>';
    const section=(title,note,body)=>'<section class="section"><div class="section-head"><h2>'+esc(title)+'</h2><p>'+esc(note)+'</p></div>'+body+'</section>';
    const table=(headers,rows)=>'<div class="table-wrap"><table class="table"><thead><tr>'+headers.map(item=>'<th>'+esc(item)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
    const rateCell=m=>'<td class="num">'+pct(m?.percentage)+'<span class="metric-note">'+num(m?.numerator)+' / '+num(m?.denominator)+'</span></td>';
    function profile(report,group){if(group==='total')return '';const p=report.groupProfiles?.[group];if(!p)return '';return '<div class="callout"><b>'+esc(group)+' 组 · '+esc(p.groupName)+'</b><span>'+esc(p.definition)+' 示例：'+esc(p.exampleQuestion||'暂无')+'</span></div>'}
    function highFrequency(slice){const rows=(slice.citation?.urlDetails||[]).slice(0,15).map((row,index)=>'<tr><td class="num">'+(index+1)+'</td><td class="source-title">'+esc(row.title||row.siteName||'未提供标题')+'</td><td class="url"><a href="'+esc(safeUrl(row.url))+'" target="_blank" rel="noopener noreferrer">'+esc(row.url)+'</a></td><td>'+esc(row.sourceType)+'</td><td class="num">'+num(row.citationCount)+'<span class="metric-note">不去重</span></td><td class="num">'+num(row.coverageAnswers)+'<span class="metric-note">回答去重</span></td><td class="num">'+num(row.coverageQuestions)+'</td></tr>');return table(['#','页面','网址','来源类型','引用次数','覆盖回答','覆盖问题'],rows)}
    function brandComparison(slice){const rows=(slice.brandComparison?.rows||[]).map(row=>'<tr><td><b>'+esc(row.brand)+'</b></td><td class="num">'+num(row.mentionCount)+'<span class="metric-note">/ '+num(row.mentionDenominator)+' 回答</span></td><td class="num">'+num(row.firstCount)+'</td><td class="num">'+num(row.top3Count)+'</td><td class="num">'+(row.averageRank==null?'数据不足':esc(row.averageRank))+'<span class="metric-note">'+num(row.rankedAnswerCount)+' 条可排名</span></td></tr>');return table(['品牌','提及次数','首推次数','前三次数','平均排名'],rows)}
    function questionTable(report,group){const items=(report.questionComparisons||[]).filter(item=>group==='total'||item.groupId===group);const factColumns=group==='G';const rows=items.map(item=>'<tr><td>'+esc(item.questionId)+'</td><td class="category">'+esc(item.category)+'</td><td class="question">'+esc(item.questionText)+'</td>'+rateCell(item.mention)+rateCell(item.ordinaryFirst)+rateCell(item.top3)+rateCell(item.strictAdvantage)+'<td class="num">'+(item.averageRank?.value==null?'数据不足':esc(item.averageRank.value))+'<span class="metric-note">'+num(item.averageRank?.denominator)+' 条可排名</span></td>'+(factColumns?rateCell(item.brandFactCorrectness?.accuracy)+rateCell(item.brandFactCorrectness?.assessability):'')+'<td class="num '+(item.currentGap?'warning':'ok')+'">'+num(item.currentGap)+'<span class="metric-note">目标 4 次 / 有效 '+num(item.valid)+'</span></td></tr>');const headers=['问题ID','分类口径','问题','提及率','普通首推率','前三率','严格优势表达','平均排名'];if(factColumns)headers.push('事实正确率','官网可判定率');headers.push('当前缺口');return table(headers,rows)}
    const factStatusLabel=status=>({CORRECT:'正确',INCORRECT:'错误',UNKNOWN:'官网未覆盖',SUPPORTED:'官网支持',CONTRADICTED:'与官网冲突',NOT_COVERED:'官网未展示'}[status]||status);
    function factCards(facts){return '<div class="kpis">'+card('品牌事实正确率',pct(facts.accuracy?.percentage),'正确 '+num(facts.accuracy?.numerator)+' / 可判定 '+num(facts.accuracy?.denominator)+'；unknown '+num(facts.accuracy?.unknown))+card('官网事实可判定率',pct(facts.assessability?.percentage),'可判定 '+num(facts.assessability?.numerator)+' / G 组有效回答 '+num(facts.assessability?.denominator)+'；unknown '+num(facts.assessability?.unknown))+card('正确回答',num(facts.statusDistribution?.CORRECT),'回答中的玛卡事实主张全部获得冻结官网支持')+card('错误回答',num(facts.statusDistribution?.INCORRECT),'至少一条玛卡事实主张与冻结官网冲突')+card('官网未覆盖',num(facts.statusDistribution?.UNKNOWN),'无可核验主张，或至少一条主张官网未展示且没有明确冲突','UNRESOLVED')+'</div>'}
    function factAudit(facts){const questions=[...new Set((facts.evidence||[]).map(row=>row.questionId))];return '<div class="callout"><b>官网快照 '+esc(facts.officialSnapshot?.id||'未冻结')+'</b><span>只核验回答中的玛卡星球事实；竞品事实不进入分母。官网页面后续变化不会静默覆盖本次结果。</span></div><div class="fact-tools"><label for="fact-question"><b>问题</b></label><select id="fact-question" class="fact-select"><option value="all">全部 G 组问题</option>'+questions.map(id=>'<option value="'+esc(id)+'">'+esc(id)+'</option>').join('')+'</select><label for="fact-status"><b>判定</b></label><select id="fact-status" class="fact-select"><option value="all">全部状态</option><option value="CORRECT">正确</option><option value="INCORRECT">错误</option><option value="UNKNOWN">官网未覆盖</option></select><span data-fact-count></span></div><div data-fact-list></div>'}
    function renderFactEvidence(facts){const mount=document.querySelector('[data-fact-list]');const q=document.querySelector('#fact-question');const status=document.querySelector('#fact-status');const count=document.querySelector('[data-fact-count]');if(!mount||!q||!status)return;const render=()=>{const rows=(facts.evidence||[]).filter(row=>(q.value==='all'||row.questionId===q.value)&&(status.value==='all'||row.answerStatus===status.value));const visible=rows.slice(0,20);count.textContent='匹配 '+num(rows.length)+' 条回答，当前显示前 '+num(visible.length)+' 条';mount.innerHTML='<div class="fact-list">'+visible.map(row=>'<details class="fact-item"><summary class="fact-head"><b>'+esc(row.questionId+' · '+row.sampleId)+'</b><span class="fact-status" data-status="'+esc(row.answerStatus)+'">'+esc(factStatusLabel(row.answerStatus))+'</span></summary><p>'+esc(row.reason)+'</p><div class="fact-claims">'+(row.claims?.length?table(['玛卡事实主张','主题','判定','官网证据 / 说明'],row.claims.map(claim=>'<tr><td class="fact-evidence">'+esc(claim.claimText)+'</td><td>'+esc(claim.topic)+'</td><td><span class="fact-status" data-status="'+esc(claim.status)+'">'+esc(factStatusLabel(claim.status))+'</span></td><td class="fact-evidence">'+(claim.sourceUrl?'<a href="'+esc(safeUrl(claim.sourceUrl))+'" target="_blank" rel="noopener noreferrer">'+esc(claim.officialExcerpt)+'</a>':esc(claim.explanation))+'<span class="metric-note">'+esc(claim.sourcePageSha256?'页面 SHA-256 '+claim.sourcePageSha256:claim.explanation)+'</span></td></tr>')):'<div class="empty">未识别到可核验的玛卡事实主张</div>')+'</div></details>').join('')+'</div>'};q.addEventListener('change',render);status.addEventListener('change',render);render()}
    function sampling(slice,report,group){

    function douyinDetail(d){if(!d)return section('抖音引用源细分','正在载入作品级只读元数据','<div class="panel empty" role="status">抖音账号与作品发布时间分析载入中。</div>');const top=d.accountRows?.[0];const p=d.publicationTime||{};const cards=[card('抖音原始引用',num(d.rawCitationCount),'当前页签内抖音引用行总数；不去重'),card('唯一被引用作品',num(d.uniqueWorkCount),'按抖音作品 ID 去重'),card('覆盖回答',num(d.coveredAnswers),'至少引用 1 个抖音作品的回答数；按回答 ID 去重'),card('覆盖问题',num(d.coveredQuestions),'至少引用 1 个抖音作品的问题数；按问题 ID 去重'),card('引用源账号识别率',pct(d.accountCoverage?.percentage),'成功识别作品发布账号：'+num(d.accountCoverage?.numerator)+' / '+num(d.accountCoverage?.denominator)+' 个唯一作品'),card('作品发布时间识别率',pct(d.publicationCoverage?.percentage),'成功识别发布时间：'+num(d.publicationCoverage?.numerator)+' / '+num(d.publicationCoverage?.denominator)+' 个唯一作品'),card('可识别发布账号',num(d.accountCount),'按作品发布账号稳定 ID 去重；不含正文、评论或推荐视频账号'),card('账号 Top 10 集中度',pct(d.accountConcentration?.top10Share),'引用次数前 10 个发布账号 / 当前页签抖音原始引用'),card('内容年龄中位数',p.medianAgeDays==null?'数据不足':num(p.medianAgeDays)+' 天','按每条引用事件的回答日期减作品发布时间；可判定 '+num(p.eligibleCitationEvents)+' 条'),card('内容年龄 P25 / P75',p.p25AgeDays==null?'数据不足':num(p.p25AgeDays)+' / '+num(p.p75AgeDays)+' 天','仅统计发布时间不晚于回答日期的可判定引用事件'),card('内容年龄 P90',p.p90AgeDays==null?'数据不足':num(p.p90AgeDays)+' 天','90% 可判定引用事件的内容年龄不超过该值'),card('未来时间异常',num(p.futureCitationEvents),'作品发布时间晚于回答业务日期；单列且不进入年龄分布')];const core=conclusions([{title:'头部引用源账号',text:top?top.accountName+' 共被引用 '+num(top.citationCount)+' 次，涉及 '+num(top.citedWorkCount)+' 个作品。':'暂无可识别账号',grade:'高证据 · 引用作品发布者'},{title:'账号集中度',text:'Top 1 / Top 5 / Top 10 分别占 '+pct(d.accountConcentration?.top1Share)+' / '+pct(d.accountConcentration?.top5Share)+' / '+pct(d.accountConcentration?.top10Share)+'。',grade:'高证据 · 原始引用行'},{title:'作品时间中位数',text:p.medianAgeDays==null?'发布时间证据不足。':'引用时距作品发布中位 '+num(p.medianAgeDays)+' 天；P90 为 '+num(p.p90AgeDays)+' 天。',grade:p.medianAgeDays==null?'证据不足':'高证据 · 可见发布时间'},{title:'解释边界',text:'这些账号是引用作品发布账号；结果只描述本次引用分布，不代表平台偏好、索引延迟或合作意愿。',grade:'限制说明'}]);const tiers=table(['账号作品层级','账号数','被引用作品数','引用次数','引用占比'],(d.accountTiers||[]).map(row=>'<tr><td>'+esc(row.name)+'</td><td class="num">'+num(row.accountCount)+'</td><td class="num">'+num(row.citedWorkCount)+'</td><td class="num">'+num(row.citationCount)+'</td><td class="num">'+pct(row.citationShare)+'</td></tr>'));const months=table(['作品发布月份','唯一作品数','占已知发布时间作品'],(p.publicationMonths||[]).slice().reverse().map(row=>'<tr><td>'+esc(row.month)+'</td><td class="num">'+num(row.workCount)+'</td><td class="num">'+pct(row.share)+'</td></tr>'));return section('抖音引用源细分','账号专指引用作品的发布账号；总览与 A-H 均按当前页签重新聚合',core+'<div style="height:12px"></div><div class="kpis">'+cards.join('')+'</div><div style="height:18px"></div><div class="split"><div class="panel"><h3>引用作品内容年龄</h3><p class="caption">按引用事件统计；发布时间晚于回答日期和未知日期不进入分母</p>'+bars(p.ageBuckets||[])+'</div><div class="panel"><h3>发布账号作品层级</h3><p class="caption">按每个账号被引用的唯一作品数归纳</p>'+tiers+'</div></div><div style="height:18px"></div><div class="split"><div class="panel"><h3>具体引用源账号</h3><p class="caption">引用次数不去重；作品、回答和问题分别去重</p>'+douyinAccountTable(d)+'</div><div class="panel"><h3>引用作品发布时间</h3><p class="caption">按唯一作品统计，表示源内容发布时间，不是回答生成月份</p>'+months+'</div></div>')}
    function citation(slice,report,group,data,douyin){const c=slice.citation;const cards=[card('回答引用覆盖率',pct(c.coverage.percentage),'含至少 1 个规范化 URL 的回答：'+num(c.coverage.numerator)+' / '+num(c.coverage.denominator)+'；不代表品牌出现'),card('原始引用数',num(c.rawCitationCount),'回答引用列表的原始行数；不去重，商品卡不计入'),card('样本内规范化引用',num(c.normalizedCitationCount),'去跟踪参数后按回答去重；重复 '+num(c.duplicateCount)+' 条'),card('全局唯一 URL',num(c.globallyUniqueUrlCount),'跨全部回答按规范化 URL 去重'),card('域名数',num(c.domainCount),'按规范化主机名去重'),card('每回答均值',c.perSample.mean,'样本内规范化引用数均值；分母为 '+num(c.eligible)+' 条引用状态可判定回答'),card('每回答中位数',c.perSample.median,'样本内规范化引用数 P50'),card('每回答 P90',c.perSample.p90,'样本内规范化引用数 nearest-rank P90'),card('重复占比',pct(c.duplicateShare),'样本内重复 URL 行 / 原始引用行：'+num(c.duplicateCount)+' / '+num(c.rawCitationCount)),card('玛卡官网引用覆盖率',pct(c.officialSourceCoverage.percentage),'含 makaplanet.com 首页、内页或子域的回答：'+num(c.officialSourceCoverage.numerator)+' / '+num(c.officialSourceCoverage.denominator)),card('官网首页引用行',num(c.officialLayers.homepage),'样本内 URL 去重后的官网首页引用；统计的是引用行，不是回答数'),card('官网内页 / 子域引用行',num(c.officialLayers.mainSitePage)+' / '+num(c.officialLayers.subdomain),'样本内 URL 去重后的主站内页和子域引用；首页、内页或子域分别统计'),card('商品卡出现率',pct(slice.productCards.percentage),'含玛卡星球可点击购买链接的回答：'+num(slice.productCards.numerator)+' / '+num(slice.productCards.denominator)),card('发布日期覆盖率',pct(c.freshness.coveragePercentage),'原冻结引用字段中明确 published_at 日期的原始引用；抖音作品日期另见细分模块')];const freshnessCards=[card('发布日期可判定',num(c.freshness.datedCitationCount),'原始冻结引用字段中有日期的行数；抖音只读补充数据不改写这里'),card('内容年龄中位数',c.freshness.medianAgeDays==null?'数据不足':c.freshness.medianAgeDays+' 天','仅统计原冻结引用字段中的明确日期'),card('30 天内引用',num(c.freshness.ageBuckets['0-30天']),'原冻结字段口径；抖音作品精细分桶见下方'),card('一年以上引用',num(c.freshness.ageBuckets['365天以上']),'原冻结字段口径；未知不推断')];const concentration=[card('Top 1 页面集中度',pct(c.concentration.top1Share),'最高频页面原始引用次数 / 全部有效原始引用'),card('Top 3 页面集中度',pct(c.concentration.top3Share),'前三高频页面原始引用次数 / 全部有效原始引用'),card('Top 10 页面集中度',pct(c.concentration.top10Share),'前十高频页面原始引用次数 / 全部有效原始引用'),card('URL HHI',num(c.concentration.hhi),'按原始有效引用的 URL 份额平方和 × 10,000；越高越集中')];const account=[card('原冻结账号字段覆盖率',pct(c.accountInteraction.coveragePercentage),'仅统计原冻结引用字段；新增抖音作品发布账号见独立细分模块',c.accountInteraction.evidenceRows?'READY':'UNRESOLVED'),card('原冻结可识别账号数',num(c.accountInteraction.accountCount),'不使用站点名替代账号；抖音补充元数据不改写原字段',c.accountInteraction.evidenceRows?'READY':'UNRESOLVED')];const d=douyin?(group==='total'?douyin.totals:douyin.groups?.[group]):null;return profile(report,group)+section('核心结论','先给可直接使用的结论，再展开统计证据',conclusions(citationCore(slice)))+section('引用指标','所有指标注明去重层级、分子和分母','<div class="kpis">'+cards.join('')+'</div>')+section('内容新旧','原冻结字段口径；抖音作品级发布时间在独立模块分析','<div class="kpis">'+freshnessCards.join('')+'</div>')+section('来源结构 · 集中度和来源属性','集中度按原始有效 URL 行；来源类型沿用采集端 category 字段','<div class="kpis">'+concentration.join('')+'</div><div style="height:12px"></div><div class="split"><div class="panel"><h3>来源类型</h3><p class="caption">采集端 category；引用次数不去重</p>'+sourceTypes(c)+'</div><div class="panel"><h3>来源属性</h3><p class="caption">按域名归为官方、社交、媒体、社区或其他</p>'+sourceAttributes(c)+'</div></div>')+section('高频引用页面','引用次数不去重；覆盖回答和覆盖问题去重',highFrequency(slice))+douyinDetail(d)+section('网址与合作','支持检索当前页签全部唯一 URL；合作候选只依据本次引用体量','<div class="callout"><b>候选筛选边界</b><span>优先核验非玛卡官方的高频域名、页面和引用源账号。正式接洽前需另查公司主体、业务匹配、联系方式与授权状态。</span></div>'+allUrls(c))+section('账号与互动 · 原冻结字段','与抖音作品页只读补充元数据分开呈现','<div class="kpis">'+account.join('')+'</div><div class="callout"><b>限制</b><span>'+esc(c.accountInteraction.limitation||'账号与互动只覆盖部分引用，不能外推全部来源。')+'</span></div>')+section('最终回答','严格区分“已引用来源分布”和“算法选择偏好”',finalAnswers(c))+section('质量与限制','所有回答和引用均可回到冻结数据逐条复核','<div class="module-list"><article><h3>同一冻结数据</h3><p>采样与引用仪表盘读取同一 data.json 字节与同一 SHA-256；抖音元数据单独保存，不改写回答或原始引用。</p></article><article><h3>账号定义</h3><p>抖音账号仅指被引用作品的发布账号，不含正文提及、评论或推荐视频账号。</p></article><article><h3>发布时间定义</h3><p>抖音作品发布时间来自公开作品页，表示源内容发布时间，不是回答生成时间。</p></article><article><h3>不能推断权重</h3><p>没有     function reconcileAccountSections(){const sections=[...mount.querySelectorAll('.section')];const dataFiles=sections.find(section=>section.querySelector('h2')?.textContent==='数据文件');if(dataFiles)dataFiles.querySelector('.section-head p').textContent='冻结只读文件；内容哈希可逐项复核';const account=sections.find(section=>section.querySelector('h2')?.textContent==='抖音引用源细分');const legacy=sections.find(section=>section.querySelector('h2')?.textContent==='账号与互动 · 原冻结字段');if(legacy)legacy.remove();if(!account)return;const slice=state.douyin?(state.group==="total"?state.douyin.totals:state.douyin.groups[state.group]):null;if(slice){const counts=slice.metadataStatusCounts||{};const gap=document.createElement("div");gap.className="callout";gap.textContent="当前组作品状态：成功 "+(counts.SUCCESS||0)+"；字段不完整 "+(counts.PARTIAL||0)+"；作品不可用 "+(counts.UNAVAILABLE||0)+"；需登录 "+(counts.LOGIN_REQUIRED||0)+"；平台验证 "+(counts.RISK_CONTROL||0)+"；失败 "+(counts.FAILED||0)+"；待采集 "+(counts.PENDING||0)+"。缺失记录保留在识别率分母中，账号排名属于阶段性结果。";if(state.douyin.stopReason==="DETAIL_SERVICE_EMPTY_RESPONSE")gap.textContent+=" 当前抖音作品详情接口返回空响应，采集暂停；网页的不存在提示不能作为作品已删除的证据。";account.prepend(gap);} account.id='douyin-accounts';const heading=account.querySelector('h2');heading.textContent='账号与互动 · 抖音引用源细分';const core=sections.find(section=>section.querySelector('h2')?.textContent==='核心结论');if(core)core.after(account);}
    const state={data:null,report:null,douyin:null,group:'total',stage:'boot'};
    const mount=document.querySelector('[data-view]');
    const tabs=[...document.querySelectorAll('[data-group]')];
    const fetchJson=async path=>{const response=await fetch(path);if(!response.ok)throw new Error(path+' '+response.status);return response.json()};
    function updateChrome(){const report=state.report;document.querySelector('[data-snapshot]').textContent=report.snapshotId;document.querySelector('[data-planned]').textContent=num(report.totals.planned);document.querySelector('[data-valid]').textContent=num(report.totals.valid);document.querySelector('[data-hash]').textContent=report.sourceDataHash;document.querySelector('[data-status]').textContent=state.stage==='full'?report.status:'概要已显示 · 明细载入中';document.querySelector('[data-callout] span').textContent=report.status==='FULL'?'累计 424 条有效回答已冻结；A-H 每题均有 4 次观测。引用覆盖表示任意来源 URL，不等于品牌提及或官网出现。':'PARTIAL：缺口与 unknown 保留，不按零计入有效分母。';document.documentElement.dataset.readyStage=state.stage}
    function render(){const previousQuestion=document.querySelector('#question-select')?.value;const report=state.report;const data=state.data||{samples:[]};const slice=state.group==='total'?report.totals:report.groups[state.group];mount.innerHTML=VIEW==='citation'?citation(slice,report,state.group,data,state.douyin):sampling(slice,report,state.group);reconcileAccountSections();mount.setAttribute('aria-labelledby','group-tab-'+state.group);if(VIEW==='citation'){bindUrlSearch(slice.citation);const d=state.douyin?(state.group==='total'?state.douyin.totals:state.douyin.groups?.[state.group]):null;if(d)bindDouyinAccountSearch(d)}if(VIEW==='sampling'&&state.group==='G')renderFactEvidence(slice.brandFactCorrectness);const select=document.querySelector('#question-select');if(!select)return;if(previousQuestion&&[...select.options].some(option=>option.value===previousQuestion))select.value=previousQuestion;const renderSelectedAnswer=()=>{if(state.data){renderAnswers(state.data,state.report,select.value)}else{document.querySelector('[data-answer-list]').innerHTML='<div class="panel empty" role="status" aria-live="polite">完整回答与引用网页明细载入中，汇总数据可先行浏览。</div>'}};renderSelectedAnswer();select.addEventListener('change',renderSelectedAnswer)}
    function selectGroup(button,focus=false){tabs.forEach(item=>{const selected=item===button;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1});state.group=button.dataset.group;render();if(focus)button.focus()}
    tabs.forEach((button,index)=>{button.addEventListener('click',()=>selectGroup(button));button.addEventListener('keydown',event=>{let next=index;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();selectGroup(tabs[next],true)})});
    async function loadDashboard(){const summary=await fetchJson('./dashboard-summary.json');state.report=summary.report;state.stage='summary';updateChrome();render();window.__MAKAPLANET_DASHBOARD_READY__={view:VIEW,dataHash:state.report.sourceDataHash,planned:state.report.totals.planned,version:'V8',stage:'summary'};try{const [data,report,douyin]=await Promise.all([fetchJson('./data.json'),fetchJson('./analysis.json'),fetchJson('./douyin-analysis.json')]);state.data=data;state.report=report;state.douyin=douyin;state.stage='full';updateChrome();render();window.__MAKAPLANET_DASHBOARD_READY__={view:VIEW,dataHash:report.sourceDataHash,planned:data.samples.length,version:'V8-Douyin',stage:'full',douyinWorks:douyin.completedWorks}}catch(error){document.querySelector('[data-status]').textContent='概要可用 · 明细加载失败';console.error(error)}}
    loadDashboard().catch(error=>{document.querySelector('[data-status]').textContent='数据加载失败';mount.innerHTML='<div class="panel empty">'+esc(error.message||error)+'</div>';console.error(error)});
